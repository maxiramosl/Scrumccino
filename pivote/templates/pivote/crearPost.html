{% extends 'pivote/base.html' %}
{% load static %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Post</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background: url("{% static 'pivote/image.png' %}") no-repeat center center fixed;
            background-size: cover;
            color: #333;
        }
        .form-container {
            background-color: #a18466;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 50px auto;
        }
        label {
            font-size: 1.2em;
            font-weight: bold;
        }
        .btn-custom {
            background-color: #564410;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-custom:hover {
            background-color: #0056b3;
        }
        .alert {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .alert-success {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        .alert-danger {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2 class="text-center mb-4" style="font-weight: bolder;">Crear Nuevo Post</h2>
        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'success' %}alert-success{% elif message.tags == 'error' %}alert-danger{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        <form action="{% url 'crearPost' %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="asignatura" class="form-label">Asignatura:</label>
                <select name="asignatura" class="form-control">
                    {% for asignatura in asignaturas %}
                        <option value="{{ asignatura.name }}">{{ asignatura.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="titulo" class="form-label">Título:</label>
                <input type="text" class="form-control" name="titulo" placeholder="Título" id="titulo" />
            </div>
            <div class="form-group">
                <label for="contenido" class="form-label">Contenido:</label>
                <textarea class="form-control" name="contenido" placeholder="Contenido" id="contenido" rows="5"></textarea>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-custom">Crear Post</button>
            </div>
        </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
{% endblock %}
