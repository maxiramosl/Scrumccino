{% extends 'pivote/base.html' %}

{% load static %}

{% block content %}
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <div class="centro borde">
      <img src="{% static 'pivote/logo.png' %}" alt="Logo" class="img-fluid mx-auto d-block tamaño-logo">
      <h2 class="texto border-bottom" style="padding-top: 40px; padding-bottom: 10px; margin-bottom: 25px; padding-left: 10px; color: #ba9b2a;">Iniciar Sesión</h2>
      <form method="post" class="card mt-5 custom-form" style="color: #ba9b2a;">
          {% csrf_token %}
          <div class="row"></div>
        <div class="mb-4">
          <label for="usuario" class="form-label" style="color:#ba9b2a">Nombre de usuario</label>
          <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Username" >
          </div>  
        <div class="mb-4">
            <label for="contraseña" class="form-label" style="color:#ba9b2a">Contraseña</label>
            <input type="password" class="form-control" id="contraseña" name="contraseña" placeholder="Contraseña">
          </div>
        <div class="d-grid gap-2">
          <button class="btn btn-outline-warning btn-lg" href="http://127.0.0.1:8000/" type="submit" >Iniciar sesion</button>
          <a class="btn btn-link" href="http://127.0.0.1:8000/" role="button" type="submit" style="color:#ba9b2a">Home</a>
        </div>
      </form>
    </div>
  </form>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
{% endblock %}
